openapi: 3.0.3
info:
  title: TransAndes TMS API (extracto MVP)
  version: 0.3.0
  description: Contrato de ejemplo didáctico. Empresa ficticia.
servers:
  - url: https://api.transandes.example/v1
security:
  - bearerAuth: []
paths:
  /clientes:
    post:
      summary: Registrar cliente generador de carga (US1, soporte)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nit, razonSocial]
              properties:
                nit: { type: string, example: "900123456-7" }
                razonSocial: { type: string }
      responses:
        '201': { description: Cliente creado, content: { application/json: { schema: { $ref: '#/components/schemas/Creado' } } } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }
  /clientes/{id}:
    get:
      summary: Consultar cliente
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Cliente }
        '404': { description: No existe }
  /vehiculos:
    post:
      summary: Registrar vehículo (Flota, FR-003)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehiculoNuevo' }
      responses:
        '201': { description: Vehículo creado, content: { application/json: { schema: { $ref: '#/components/schemas/Creado' } } } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }
  /vehiculos/{id}:
    get:
      summary: Consultar vehículo (incluye documentosVigentes a la fecha)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Vehículo }
        '404': { description: No existe }
  /conductores:
    post:
      summary: Registrar conductor (Flota, FR-003)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConductorNuevo' }
      responses:
        '201': { description: Conductor creado, content: { application/json: { schema: { $ref: '#/components/schemas/Creado' } } } }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }
  /conductores/{id}:
    get:
      summary: Consultar conductor — cédula enmascarada (******1234) y sin celular (Ley 1581)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Conductor }
        '404': { description: No existe }
  /ordenes:
    post:
      summary: Registrar orden de cargue (FR-001, US1)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrdenNueva' }
      responses:
        '201': { description: Orden creada, content: { application/json: { schema: { $ref: '#/components/schemas/Creado' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '422': { $ref: '#/components/responses/Validacion' }
  /ordenes/{id}:
    get:
      summary: Consultar orden de cargue
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Orden }
        '404': { description: No existe }
  /viajes:
    post:
      summary: Crear viaje desde una orden (FR-002, US1)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ordenId]
              properties: { ordenId: { type: string, format: uuid } }
      responses:
        '201': { description: Viaje en estado Planeado, content: { application/json: { schema: { $ref: '#/components/schemas/Viaje' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /viajes/{id}:
    get:
      summary: Consultar un viaje
      parameters: [ { $ref: '#/components/parameters/ViajeId' } ]
      responses:
        '200': { description: Viaje, content: { application/json: { schema: { $ref: '#/components/schemas/Viaje' } } } }
        '404': { description: No existe }
  /viajes/{id}/asignacion:
    put:
      summary: Asignar vehículo y conductor (FR-003, US1)
      parameters: [ { $ref: '#/components/parameters/ViajeId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [vehiculoId, conductorId]
              properties:
                vehiculoId: { type: string, format: uuid }
                conductorId: { type: string, format: uuid }
      responses:
        '200': { description: Viaje Asignado, content: { application/json: { schema: { $ref: '#/components/schemas/Viaje' } } } }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Validacion' }
  /viajes/{id}/despacho:
    post:
      summary: Confirmar despacho y encolar envío al RNDC (FR-004, US2)
      parameters: [ { $ref: '#/components/parameters/ViajeId' } ]
      responses:
        '202': { description: Envío al RNDC encolado; el resultado llega por SignalR }
  /viajes/{id}/eventos:
    post:
      summary: Sincronizar eventos desde la app (FR-007, US3) — idempotente por eventId
      parameters: [ { $ref: '#/components/parameters/ViajeId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/Evento' }
      responses:
        '200': { description: Eventos aceptados (los repetidos se ignoran) }
  /viajes/{id}/ubicaciones:
    post:
      summary: Reportar ubicación (FR-009, US4)
      parameters: [ { $ref: '#/components/parameters/ViajeId' } ]
      responses:
        '204': { description: Recibida }
  /t/{token}:
    get:
      summary: Rastreo público para el cliente (FR-010, US4)
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Estado, última ubicación, ETA y prueba de entrega }
        '410': { description: Enlace expirado }
components:
  responses:
    Validacion:
      description: Reglas de negocio incumplidas (documentos vencidos, capacidad, longitudes máximas, datos inválidos). Un JSON mal formado o un enum no textual responde 400.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    NoEncontrado:
      description: Recurso referenciado inexistente
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
    Conflicto:
      description: Conflicto con el estado actual (recurso ocupado, duplicado)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ViajeId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Creado:
      type: object
      properties: { id: { type: string, format: uuid } }
    Problema:
      description: RFC 9457 Problem Details con la lista de errores de negocio
      type: object
      properties:
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errores:
          type: array
          items:
            type: object
            properties:
              codigo: { type: string, example: DOCUMENTO_VEHICULO_VENCIDO }
              mensaje: { type: string }
    Viaje:
      type: object
      properties:
        id: { type: string, format: uuid }
        consecutivo: { type: string, example: V-000001 }
        ordenId: { type: string, format: uuid }
        estado: { type: string, enum: [Planeado, Asignado, RechazadoRndc, Despachado, EnRuta, Entregado, Anulado] }
        vehiculoId: { type: string, format: uuid, nullable: true }
        conductorId: { type: string, format: uuid, nullable: true }
    VehiculoNuevo:
      type: object
      required: [placa, tipo, capacidadKg, vinculacion, venceSoat, venceRtm]
      properties:
        placa: { type: string, example: TAC123 }
        tipo: { type: string }
        capacidadKg: { type: integer, minimum: 1 }
        vinculacion: { type: string, enum: [Propio, Afiliado] }
        venceSoat: { type: string, format: date }
        venceRtm: { type: string, format: date }
    ConductorNuevo:
      type: object
      required: [cedula, nombre, licenciaCategoria, venceLicencia]
      properties:
        cedula: { type: string, example: "1037000111" }
        nombre: { type: string }
        celular: { type: string }
        licenciaCategoria: { type: string, example: C2 }
        venceLicencia: { type: string, format: date }
    OrdenNueva:
      type: object
      required: [clienteId, origen, destino, pesoKg, fechaRequerida]
      properties:
        clienteId: { type: string, format: uuid }
        origen: { type: string, example: "Medellín, Antioquia" }
        destino: { type: string, example: "Barranquilla, Atlántico" }
        tipoMercancia: { type: string }
        pesoKg: { type: number, minimum: 1 }
        volumenM3: { type: number }
        fechaRequerida: { type: string, format: date }
    Evento:
      type: object
      required: [eventId, tipo, horaDispositivo]
      properties:
        eventId: { type: string, format: uuid }
        tipo: { type: string, enum: [EnCargue, EnRuta, Novedad, EnDescargue, Entregado] }
        detalle: { type: string }
        fotoUrl: { type: string }
        horaDispositivo: { type: string, format: date-time }
